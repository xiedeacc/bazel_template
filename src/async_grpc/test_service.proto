//
// A minimal service used only by src/async_grpc/server_test.cc. The package
// name deliberately avoids a nested 'testing' namespace so that it cannot
// collide with '::testing' from googletest.

syntax = "proto3";

package async_grpc_test;

message TestRequest {
  int32 value = 1;
}

message TestResponse {
  int32 value = 1;
}

service TestService {
  // Unary.
  rpc Echo(TestRequest) returns (TestResponse) {}

  // Server streaming: emits 'value' responses numbered 0..value-1.
  rpc EchoStream(TestRequest) returns (stream TestResponse) {}

  // Client streaming: responds with the sum of all requests.
  rpc SumStream(stream TestRequest) returns (TestResponse) {}
}
